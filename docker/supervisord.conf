[unix_http_server]
file=/run/gpu/supervisor.sock
chmod=0700
chown=gpu:gpu

[supervisord]
nodaemon=true
logfile=/workspace/.gpu/logs/supervisor.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/run/gpu/supervisord.pid
childlogdir=/workspace/.gpu/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/gpu/supervisor.sock

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:inference]
command=/usr/local/bin/fastgpu worker serve
user=gpu
directory=/home/gpu
environment=HOME="/home/gpu",USER="gpu",LOGNAME="gpu"
autostart=false
autorestart=unexpected
startsecs=3
startretries=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/workspace/.gpu/logs/inference.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
